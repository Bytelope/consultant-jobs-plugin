name: Publish to MCP Registry

on:
  workflow_dispatch:

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish dev.consultant/assignments
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Install verified MCP publisher
        env:
          PUBLISHER_VERSION: "1.8.1"
          PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/${archive}"
          echo "${PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate Consultant.dev namespace
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${MCP_PRIVATE_KEY}"
          ./mcp-publisher login http \
            --domain consultant.dev \
            --private-key "${MCP_PRIVATE_KEY}"

      - name: Publish registry metadata
        run: ./mcp-publisher publish

      - name: Verify published entry
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            'https://registry.modelcontextprotocol.io/v0.1/servers?search=dev.consultant%2Fassignments')"
          jq --exit-status \
            '.servers | any(.server.name == "dev.consultant/assignments" and .server.version == "1.0.0")' \
            <<<"${response}"
